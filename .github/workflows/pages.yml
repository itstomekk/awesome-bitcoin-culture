name: Gallery (GitHub Pages)

on:
  push:
    branches: [master]
    paths: [README.md, gallery/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # README is the source of truth: re-parse it on every push (new entries show up with a generated tile
      # until `python gallery/scripts/build.py` is run locally to fetch their images).
      - name: Parse README and assemble site
        working-directory: gallery
        run: |
          python scripts/build.py --no-fetch
          python scripts/assemble.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: gallery/dist
      - id: deployment
        uses: actions/deploy-pages@v4
