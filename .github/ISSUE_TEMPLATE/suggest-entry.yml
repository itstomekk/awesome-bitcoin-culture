name: Suggest an entry
description: Propose a Bitcoin culture creator, work, publication, or resource
title: "[List suggestion] "
body:
  - type: markdown
    attributes:
      value: >-
        Thanks for helping improve this curated list. Suggestions are reviewed by a maintainer and are not automatically accepted. Please read "What belongs here" in the README first.

  - type: input
    id: entry
    attributes:
      label: Creator, work, or resource
      description: Give the public name people should see in the list.
      placeholder: Example artist or work
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Best-fit section
      options:
        - Visual Art (incl. memes)
        - Literature
        - Music & Performing Arts
        - Film & Documentary
        - Games
        - Galleries & Museums
        - Grants, Funders & Patronage
        - Publications & Media
        - Platforms & Marketplaces
        - Events & Festivals
        - Not sure
    validations:
      required: true

  - type: input
    id: work-link
    attributes:
      label: Link to the actual work
      description: Prefer a page where the work can be viewed, read, or heard, not only a general profile or marketplace.
      placeholder: https://example.com/work
    validations:
      required: true

  - type: input
    id: creator
    attributes:
      label: Creator or studio
      description: Name the human creator or identifiable collective where applicable. Memes are the stated exception.
      placeholder: Creator name
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why does it fit this list?
      description: Explain the creative work's connection to Bitcoin and what makes it worth including. Keep it factual.
      placeholder: A short, specific explanation.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Supporting sources
      description: Add organizer, creator, publisher, or other reliable sources that confirm the work and its details.
      placeholder: Paste source URLs and any relevant context.
    validations:
      required: true
